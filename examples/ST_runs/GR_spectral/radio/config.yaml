seed: 43
dry_run: false
validate_only: false
eos:
  type: spectral
  crust_name: SLy
  n_points_high: 100
  reparametrized: true
tov:
  ndat_TOV: 100
  nb_masses: 100
  min_nsat_TOV: 0.75
  type: gr
prior:
  specification_file: prior.prior
likelihoods:
- type: constraints_eos
  enabled: true
- type: max_mass_bounds
  enabled: true
  name: "Joint_Mass_Bounds"
  lower_mean: [1.908, 2.01]
  lower_std: [0.016, 0.04]
  upper_mean: 2.16
  upper_std: 0.17
  penalty_value: -1e5
sampler:
  type: smc-rw
  n_particles: 5000
  n_mcmc_steps: 10
  target_ess: 0.9
  random_walk_sigma: 0.1
  n_eos_samples: 5000
  output_dir: ./outdir/
postprocessing:
  enabled: true
  make_cornerplot: false
  make_massradius: true
  make_pressuredensity: true
