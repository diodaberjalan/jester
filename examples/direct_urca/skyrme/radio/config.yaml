seed: 42
dry_run: false
validate_only: false

eos:
  type: "skyrme_only"
  calculate_durca: true
  ndat_skyrme: 100
  nmax_nsat: 25.0
  nb_CSE: 0
  crust_name: "DH"

tov:
  type: "gr"
  min_nsat_TOV: 0.75
  ndat_TOV: 100
  nb_masses: 100

prior:
  specification_file: "prior.prior"

likelihoods:
- type: max_mass_bounds
  enabled: true
  name: "Joint_Mass_Bounds"
  lower_mean: [1.908, 2.01]
  lower_std: [0.016, 0.04]
  upper_mean: 2.16
  upper_std: 0.17
  penalty_value: -1e5
sampler:
  type: smc-rw
  n_particles: 1000
  n_mcmc_steps: 10
  target_ess: 0.9
  random_walk_sigma: 0.1
  n_eos_samples: 1000
  output_dir: ./outdir/

postprocessing:
  enabled: true
  make_cornerplot: false
  make_massradius: true
  make_pressuredensity: true
