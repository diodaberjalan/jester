seed: 42
dry_run: false
validate_only: false

eos:
  type: "metamodel_only"
  calculate_durca: true
  ndat_metamodel: 100
  nmax_nsat: 25.0
  nb_CSE: 0
  crust_name: "DH"

tov:
  type: "gr"
  min_nsat_TOV: 0.75
  ndat_TOV: 100
  nb_masses: 100

prior:
  specification_file: "prior.prior"

likelihoods:
- type: gw
  enabled: true
  events:
  - name: GW170817
  penalty_value: -99999.0
  N_masses_evaluation: 2000
  N_masses_batch_size: 1000
  seed: 42
sampler:
  type: smc-rw
  n_particles: 1000
  n_mcmc_steps: 10
  target_ess: 0.9
  random_walk_sigma: 0.1
  n_eos_samples: 1000
  output_dir: ./outdir/

postprocessing:
  enabled: true
  make_cornerplot: false
  make_massradius: true
  make_pressuredensity: true
