seed: 42
dry_run: false
validate_only: false

eos:
  type: "metamodel_adaptive_cse"
  calculate_durca: true
  ndat_metamodel: 100
  nmax_nsat: 25.0
  nb_CSE: 6
  ndat_CSE: 100
  cs2_high_threshold: 0.95
  cs2_low_threshold: 0.05
  crust_name: "DH"

tov:
  type: "gr"
  min_nsat_TOV: 0.75
  ndat_TOV: 100
  nb_masses: 100

prior:
  specification_file: "prior.prior"

likelihoods:
- type: constraints_eos
  enabled: true
- type: max_mass_bounds
  enabled: true
  name: "Joint_Mass_Bounds"
  lower_mean: [1.908, 2.01]
  lower_std: [0.016, 0.04]
  upper_mean: 2.16
  upper_std: 0.17
  penalty_value: -1e5
- type: nicer
  enabled: true
  pulsars:
  - name: J0030
    amsterdam_model_dir: ../../../../jesterTOV/inference/flows/models/nicer_maf/J00300451/amsterdam_st_pst
    maryland_model_dir: ../../../../jesterTOV/inference/flows/models/nicer_maf/J00300451/maryland_2spot_rm
  N_masses_evaluation: 20
  N_masses_batch_size: 20
- type: nicer
  enabled: true
  pulsars:
  - name: J0740
    amsterdam_model_dir: ../../../../jesterTOV/inference/flows/models/nicer_maf/J07406620/amsterdam_gamma_nicerxmm
    maryland_model_dir: ../../../../jesterTOV/inference/flows/models/nicer_maf/J07406620/maryland_unknown_nicerxmm_rm
  N_masses_evaluation: 20
  N_masses_batch_size: 20
- type: gw
  enabled: true
  events:
  - name: GW170817
  penalty_value: -99999.0
  N_masses_evaluation: 2000
  N_masses_batch_size: 1000
  seed: 42
sampler:
  type: smc-rw
  n_particles: 1000
  n_mcmc_steps: 10
  target_ess: 0.9
  random_walk_sigma: 0.1
  n_eos_samples: 1000
  output_dir: ./outdir/

postprocessing:
  enabled: true
  make_cornerplot: false
  make_massradius: true
  make_pressuredensity: true