seed: 44
dry_run: false
validate_only: false
eos:
  type: spectral
  crust_name: DH
  n_points_high: 100
tov:
  min_nsat_TOV: 0.75
  ndat_TOV: 100
  nb_masses: 100
  type: scalar_tensor
prior:
  specification_file: prior.prior
likelihoods:
- type: constraints_eos
  enabled: true
- type: constraints_gamma
  enabled: true
  penalty_gamma: -1.0e10
- type: radio
  enabled: true
  pulsars:
  - name: J1614
    mass_mean: 1.94
    mass_std: 0.06
  - name: J0740
    mass_mean: 2.08
    mass_std: 0.14
- type: gw
  enabled: true
  events:
  - name: GW170817
  penalty_value: -99999.0
  N_masses_evaluation: 2000
  N_masses_batch_size: 1000
  seed: 42
sampler:
  type: smc-rw
  n_particles: 5000
  n_mcmc_steps: 10
  target_ess: 0.9
  random_walk_sigma: 0.1
  n_eos_samples: 5000
  output_dir: ./outdir/
postprocessing:
  enabled: true
  make_cornerplot: false
  make_massradius: true
  make_pressuredensity: true
