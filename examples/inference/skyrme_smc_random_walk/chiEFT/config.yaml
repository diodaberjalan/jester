seed: 42
dry_run: false
validate_only: false

eos:
  type: "skyrme_cse"
  ndat_skyrme: 100
  nmax_nsat: 12.0
  nb_CSE: 4
  crust_name: "DH"

tov:
  type: "gr"
  min_nsat_TOV: 0.75
  ndat_TOV: 100
  nb_masses: 100

prior:
  specification_file: "prior.prior"

likelihoods:
  - type: "constraints_eos"
    enabled: true
  - type: "chieft"
    enabled: true
    # ChiEFT data paths are absolute or relative to run location
    low_filename: "../../../../jesterTOV/inference/data/chiEFT/2402.04172/low.dat"
    high_filename: "../../../../jesterTOV/inference/data/chiEFT/2402.04172/high.dat"
    nb_n: 100

sampler:
  type: "smc-rw"
  n_particles: 1000
  n_mcmc_steps: 10
  target_ess: 0.9
  random_walk_sigma: 0.1
  output_dir: "./outdir/"

postprocessing:
  enabled: true
  make_cornerplot: false
  make_massradius: true
  make_pressuredensity: true
